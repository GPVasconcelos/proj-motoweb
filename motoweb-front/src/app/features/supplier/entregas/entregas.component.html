<h2 class="text-center mt-4">Entregas Pendentes</h2>

<div class="table-responsive px-2">
  <table class="table table-bordered table-striped align-middle text-center">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Retirada</th>
        <th>Destino</th>
        <th>Destinatário</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let d of delivery">
        <td>{{ d.id }}</td>
        <td>{{ d.pickup }}</td>
        <td>{{ d.destination }}</td>
        <td>{{ d.recipient }}</td>
        <td>
          <span class="badge bg-warning text-dark">{{ d.status }}</span>
        </td>
        <td>
          <!-- Se o status for PENDING -->
          <ng-container *ngIf="d.status === 'PENDING'">
            <!-- Se ainda não tem motoboy designado -->
            <div *ngIf="!d.motoboyId" class="d-flex flex-column gap-2">
              <!-- Select para escolher o motoboy -->
              <select [(ngModel)]="d.selectedMotoboyId" class="form-select form-select-sm">
                <option [value]="0">Selecione um motoboy</option>
                <option *ngFor="let m of motoboys" [value]="m.id">{{ m.name }}</option>
              </select>
              <!-- Botão para confirmar designação -->
              <button class="btn btn-primary btn-sm" (click)="designarMotoboy(d.id, d.selectedMotoboyId)">
                Designar
              </button>
            </div>

            <!-- Se já tiver um motoboy designado, exibe o nome -->
            <div *ngIf="d.motoboyId">
              <span class="text-success">
                Designado: {{ getMotoboyNameById(d.motoboyId) }}
              </span>
            </div>
          </ng-container>
        </td>
      </tr>
    </tbody>
  </table>
</div>
