<div class="container">
  <h2>Cadastro de Cliente</h2>

  <form (ngSubmit)="onSubmit()" #form="ngForm" class="mt-4">

    <div class="mb-3">
      <label class="form-label">CNPJ</label>
      <input type="text" class="form-control" name="cnpj" [(ngModel)]="formData.cnpj" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Inscrição Estadual (opcional)</label>
      <input type="text" class="form-control" name="stateReg" [(ngModel)]="formData.stateReg">
    </div>

    <div class="mb-3">
      <label class="form-label">Nome Fantasia</label>
      <input type="text" class="form-control" name="fantasyName" [(ngModel)]="formData.fantasyName" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Setor de Atuação</label>
      <input type="text" class="form-control" name="sector" [(ngModel)]="formData.sector" required>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
      Finalizar Cadastro
    </button>
  </form>
</div>
