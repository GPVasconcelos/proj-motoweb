<div class="container">
  <h2>Cadastro de Usuário</h2>

  <form (ngSubmit)="onSubmit()" #form="ngForm" class="mt-4">

    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input type="text" class="form-control" name="name" [(ngModel)]="formData.name" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email" [(ngModel)]="formData.email" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Telefone</label>
      <input type="text" class="form-control" name="phone" [(ngModel)]="formData.phone" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Endereço</label>
      <input type="text" class="form-control" name="address" [(ngModel)]="formData.address" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Senha</label>
      <input type="password" class="form-control" name="password" [(ngModel)]="formData.password" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Confirme sua senha</label>
      <input type="password" class="form-control" name="confirmPassword" [(ngModel)]="formData.confirmPassword" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Tipo de Perfil</label>
      <select class="form-control" name="profileType" [(ngModel)]="formData.profileType" required>
        <option value="">Selecione</option>
        <option value="CLIENTE">Cliente</option>
        <option value="CENTRAL">Central</option>
        <option value="MOTOBOY">Motoboy</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
      Cadastrar
    </button>
  </form>
</div>
