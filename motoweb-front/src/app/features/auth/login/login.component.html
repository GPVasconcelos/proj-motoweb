<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4" style="min-width: 400px;">
    <h2 class="text-center mb-4">MotoWeb Login</h2>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" [(ngModel)]="email" name="email" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" class="form-control" [(ngModel)]="password" name="password" required>
      </div>

      <div *ngIf="loginError" class="alert alert-danger">
        Email ou senha inválidos
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
    <div class="text-center mt-3">
     <a routerLink="/cadastro" style="cursor: pointer;">Não tem uma conta? Cadastre-se aqui</a>
    </div>
  </div>
</div>
