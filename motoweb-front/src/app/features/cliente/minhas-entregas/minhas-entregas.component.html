<div class="container">
  <h2>Minhas Entregas</h2>

  <table class="table table-bordered table-hover mt-4">
    <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Retirada</th>
        <th>Entrega</th>
        <th>Destinatário</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let delivery of delivery">
        <td>{{ delivery.id }}</td>
        <td>{{ delivery.pickup }}</td>
        <td>{{ delivery.destination }}</td>
        <td>{{ delivery.recipient }}</td>
        <td>
          <span class="badge" [ngClass]="getStatusClass(delivery.status)">
            {{ delivery.status }}
          </span>
        </td>
        <td>
          <button 
            class="btn btn-danger btn-sm" 
            (click)="cancelDelivery(delivery.id)" 
            [disabled]="delivery.status !== 'PENDING'">
            Cancelar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
